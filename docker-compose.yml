# Optional: PostgreSQL + pgvector for FLAMEPRINT.
#   docker compose up -d db
#   then set DATABASE_URL=postgresql://flameprint:flameprint@localhost:5432/flameprint in backend/.env
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: flameprint
      POSTGRES_PASSWORD: flameprint
      POSTGRES_DB: flameprint
    ports:
      - "5432:5432"
    volumes:
      - flameprint-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flameprint"]
      interval: 5s
      retries: 10

volumes:
  flameprint-pg:
