# Render Blueprint: FLAMEPRINT API (FastAPI). Frontend deploys separately on Vercel (see DEPLOY.md).
services:
  - type: web
    name: flameprint-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"   # pin to the version the team tested; tests also pass on 3.9
      - key: FLAMEPRINT_LLM
        value: auto        # "off" forces the offline writer for a safe demo
      - key: CORS_ORIGINS
        sync: false        # e.g. https://<project>.vercel.app (comma-separated)
      - key: ANTHROPIC_API_KEY
        sync: false        # optional; set in the Render dashboard, never in the repo
